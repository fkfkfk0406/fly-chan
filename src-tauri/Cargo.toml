[package]
name = "fly-chan"
version = "0.1.0"
description = "플라이쨩 (Fly-chan) - 초파리 뇌를 가진 소녀 (데스크톱)"
edition = "2021"

[lib]
name = "fly_chan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-http = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
